[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd backend && python -m venv .venv",
  "cd backend && . .venv/bin/activate && python -m pip install --upgrade pip && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && . .venv/bin/activate && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"